name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ matrix.node }}', cache: 'npm' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      # The packed tarball imports and draws a card: what a user installs.
      - name: Packaged import
        shell: bash
        run: |
          npm pack --silent --pack-destination "$RUNNER_TEMP"
          TGZ=$(ls "$RUNNER_TEMP"/agent-business-card-*.tgz)
          mkdir "$RUNNER_TEMP/pkgtest" && cd "$RUNNER_TEMP/pkgtest"
          npm init -y >/dev/null 2>&1
          npm install "$TGZ" --silent
          node --input-type=module -e 'import { renderBusinessCard } from "agent-business-card"; const h = renderBusinessCard({ name: "x", chips: [], tabs: [], about: "" }); if (!h.startsWith("<!doctype html>")) process.exit(1); console.log("ok", h.length)'
